<!-- templates/upload.html -->
{% extends "base.html" %}

{% block content %}
<h1>Upload a File</h1>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="file" name="file" required>
  <button type="submit">Upload</button>
  {% if error %}
    <p style="color: red;"> <b>{{ error }}</b></p>
  {% endif %}

</form>
{% endblock %}
