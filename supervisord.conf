[supervisord]
nodaemon=true
user=appuser
pidfile=/app/supervisord.pid
logfile=/app/supervisord.log
logfile_maxbytes=50MB
logfile_backups=2
loglevel=info

[program:web]
# --workers=1 tells Gunicorn to spin up ONLY ONE process instead of a cluster
command=gunicorn core.wsgi:application --bind 0.0.0.0:10000 --workers=1 --threads=1
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true

[program:worker]
# --concurrency=1 forces Celery to use exactly one worker thread
# --max-tasks-per-child=10 forces Celery to drop memory leakages regularly
command=celery -A core worker --loglevel=info --concurrency=1 --max-tasks-per-child=10
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true