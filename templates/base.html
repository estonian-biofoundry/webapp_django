<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    
    <!-- Icons for footer -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <title>{% block title %}Strain QC Platform{% endblock %}</title>
  </head>
  <body>
    <header>
      <h2>Strain QC: Bioinformatics Platform for Industrial Biotechnology </h2>

        <nav>
    

{% if user.is_authenticated %}
    <span>Hello {{ user.username }}</span>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'dashboard:dashboard' %}">Dashboard</a>
    <a href="{% url 'accounts:logout' %}">Logout</a>
{% else %}
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'accounts:login' %}">Login</a>
    <a href="{% url 'accounts:signup' %}">Register</a>
{% endif %}
  </nav>

  <hr>
    </header>

    <main>
      <div class="container">
        {% block content %}
        <!-- Page-specific content will appear here -->
        {% endblock %}
      </div>
     </main>


<footer class="text-center mt-5">
  <hr />
    <p>© 2026 DigiBio Project</p>

  <p>
    <a href="https://digibio.ut.ee/" target="_blank">
      <i class="fas fa-globe"></i> Website
    </a>
    |

    <a href="https://github.com/estonian-biofoundry" target="_blank">
      <i class="fab fa-github"></i> UT_GitHub
    </a>
    |

    <a href="https://www.linkedin.com/" target="_blank">
      <i class="fab fa-linkedin"></i> LinkedIn
    </a>
    |

    <a href="https://www.instagram.com/digibio.est/" target="_blank">
      <i class="fab fa-instagram"></i> Instagram
    </a>
  </p>
</footer>
    </footer>

    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
